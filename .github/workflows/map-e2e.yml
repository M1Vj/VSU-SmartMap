name: Map E2E

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  MAP_E2E_BASE_URL: ${{ vars.MAP_E2E_BASE_URL }}

jobs:
  map-e2e:
    name: map-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - name: Start loopback Supabase stack and seed fixtures
        if: ${{ env.MAP_E2E_BASE_URL == '' }}
        run: |
          npm run db:start
          npm run db:reset
          node tools/dev/bootstrap-local.mjs
      - name: Build production bundle
        if: ${{ env.MAP_E2E_BASE_URL == '' }}
        run: npm run build
      - name: Start production server
        if: ${{ env.MAP_E2E_BASE_URL == '' }}
        run: |
          npm run start &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "next start did not become ready on http://127.0.0.1:3000" >&2
          exit 1
      - name: Run Playwright map smoke suite
        env:
          MAP_E2E_BASE_URL: ${{ vars.MAP_E2E_BASE_URL || 'http://127.0.0.1:3000' }}
        run: npm run test:map-e2e
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-map-smoke-artifacts
          path: |
            test-results/
            .playwright-mcp/
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop local Supabase
        if: ${{ always() && env.MAP_E2E_BASE_URL == '' }}
        run: npx --yes supabase@2.107.0 stop