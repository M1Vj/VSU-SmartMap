name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high

  lockfile-install:
    name: lockfile-install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts

  sensitive-file-policy:
    name: sensitive-file-policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject tracked credentials and private keys
        shell: bash
        run: |
          set -euo pipefail
          tracked="$({ git ls-files; } | grep -E '(^|/)(\.env($|\.)|.*\.(pem|key|p12|pfx)$|id_rsa$|id_ed25519$|credentials\.json$|service-account.*\.json$)' || true)"
          allowed="$(printf '%s\n' "$tracked" | grep -Ev '(^|/)\.env\.example$' || true)"
          if [[ -n "$allowed" ]]; then
            printf 'Sensitive file paths must not be tracked:\n%s\n' "$allowed" >&2
            exit 1
          fi
      - name: Scan tracked text for high-confidence secret formats
        shell: bash
        run: |
          set -euo pipefail
          if git grep -IEn '(AIza[0-9A-Za-z_-]{20,}|gh[pousr]_[A-Za-z0-9_]{20,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|SUPABASE_SERVICE_ROLE_KEY=eyJ|GMAIL_REFRESH_TOKEN=1//)' -- ':!package-lock.json' ':!.github/workflows/security.yml'; then
            echo 'High-confidence secret pattern found in tracked source.' >&2
            exit 1
          fi

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Audit GitHub Actions workflows
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
